apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: platform-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets
  target:
    name: app-secrets
  data:
  - secretKey: OBJECT_STORE_URL
    remoteRef: { key: platform/object-store-url }

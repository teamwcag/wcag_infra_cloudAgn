image:
  repository: docker.io/wcagabhinav/hello-world
  tag: "1.0.0"
  pullPolicy: IfNotPresent

uploadApi:
  replicas: 1
  containerPort: 8080

ingress:
  enabled: false
  className: "nginx"
  host: "upload.dev.example.com"
  tlsSecretName: "upload-tls"

job:
  image: busybox:1.36
  args: ["sh","-c","echo 'hello from job' && sleep 5"]
  #args: ["remediate","--object-key","tenant/demo.docx"]
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "1000m", memory: "2Gi" }
